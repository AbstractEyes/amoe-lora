[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amoe-lora"
version = "0.9.0"
description = "Aleph mixture-of-experts adapters: train, attach, align, detach — with the honesty diagnostics built in. 0.2 adds the diffusion subsystem (amoe.diffusion) and safetensors I/O."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AbstractPhil" }]
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
# COLAB RULE for every extra: floors, never ceilings, and never a torch or
# +cuXX pin. Colab (py3.12, torch 2.10, torchvision 0.25, numpy 2.x,
# huggingface_hub 1.x) already satisfies these, so pip reinstalls nothing
# binary and NO runtime restart is needed. A `<2` numpy cap or an exact
# torchvision pin anywhere would force a binary downgrade + restart.
hf = ["transformers>=4.57", "huggingface_hub"]
diffusion = ["diffusers>=0.30", "safetensors>=0.4"]
# The aleph_mnist experiment bed. torch is NOT repeated here — the core
# `torch>=2.1` already covers it, and re-declaring risks a Colab reinstall.
experiment = [
    "torchvision>=0.16",   # MNIST/FashionMNIST loaders + the CIFAR fallback
    "numpy>=1.24",         # CIFAR array path; NO upper cap (Colab is numpy 2.x)
    "matplotlib>=3.7",     # diagnostics.plots (imported lazily)
]
# Optional fast CIFAR + publishing: the uoft-cs/cifar10 parquet over HF's CDN
# (~seconds) instead of torchvision's slow mirror, AND `publish()` to a HF
# repo. `huggingface_hub` is declared explicitly (datasets pulls it anyway) so
# the publish path is guaranteed. NO `<3` cap — that predates hub 1.0 and
# would fight Colab's hub. A torchvision fallback exists, so this stays
# optional.
experiment-hf = ["amoe-lora[experiment]", "datasets>=2.19", "huggingface_hub"]

[project.scripts]
amoe-convert = "amoe.io.convert:main"
aleph-mnist = "aleph_mnist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
